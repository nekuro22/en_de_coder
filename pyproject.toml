[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "en-de-coder"
version = "3.0.0"
description = "Cross-platform file & folder encryption tool with GUI"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [
    { name = "Niklas" },
]
dependencies = [
    "cryptography>=41.0.0",
    "argon2-cffi>=23.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[project.scripts]
enc = "en_de_coder.cli:main"

[project.urls]
Repository = "https://github.com/user/en_de_coder"

[tool.setuptools.packages.find]
where = ["src"]
